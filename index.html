<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Log — يوميات محلل SOC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#0c1320; --panel:#121b2c; --panel2:#17233a; --line:#243350;
  --text:#dbe4f3; --muted:#8b9bb8; --accent:#5ac8fa;
  --easy:#4da3ff; --mid:#f5b942; --hard:#ff5d5d; --ok:#3ddc97;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f3f6fb;--panel:#fff;--panel2:#eaf0f9;--line:#d3dcec;--text:#17233a;--muted:#5d6e8c;--accent:#0a7bc4;}
}
:root[data-theme="light"]{--bg:#f3f6fb;--panel:#fff;--panel2:#eaf0f9;--line:#d3dcec;--text:#17233a;--muted:#5d6e8c;--accent:#0a7bc4;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.8;font-size:16px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.bar{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.bar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--mono);font-weight:600;font-size:17px;color:var(--text);direction:ltr;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.brand i{animation:none}}
.bar nav{margin-inline-start:auto;display:flex;gap:6px}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent);text-decoration:none}

/* hero */
.hero{padding:44px 0 26px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px);line-height:1.3}
.hero p{margin:0;color:var(--muted);max-width:620px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;font-family:var(--mono);font-size:13px;direction:ltr;justify-content:flex-end}
.stat{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;color:var(--muted)}
.stat b{color:var(--accent);font-weight:600;margin-inline-end:6px}

/* layout */
.grid{display:grid;grid-template-columns:1fr 260px;gap:28px;padding-bottom:70px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:8px;font:inherit;margin-bottom:14px}
.search::placeholder{color:var(--muted)}

/* queue table */
.queue{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.qhead,.row{display:grid;grid-template-columns:84px 1fr 86px;gap:12px;align-items:center;padding:12px 16px}
.qhead{background:var(--panel2);font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);color:var(--text);position:relative;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2);text-decoration:none}
.row::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--sev)}
.pid{font-family:var(--mono);font-size:12.5px;color:var(--muted);direction:ltr;text-align:right}
.ttl{font-weight:600;line-height:1.5}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 7px;font-family:var(--mono);direction:ltr}
.date{font-family:var(--mono);font-size:12.5px;color:var(--muted);direction:ltr;text-align:left}
.sev{--sev:var(--easy)}.sev.medium{--sev:var(--mid)}.sev.hard{--sev:var(--hard)}.sev.done{--sev:var(--ok)}
.empty{padding:34px;text-align:center;color:var(--muted)}
@media (max-width:560px){.qhead{display:none}.row{grid-template-columns:1fr}.date{text-align:right}}

/* sidebar */
aside .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
aside h3{margin:0 0 8px;font-size:15px}
.cats button{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:14.5px;padding:5px 8px;border-radius:6px;cursor:pointer;text-align:start}
.cats button:hover,.cats button.on{background:var(--panel2);color:var(--accent)}
.cats span{font-family:var(--mono);color:var(--muted);font-size:12.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:4px;font-family:var(--mono);font-size:12px;padding:1px 8px;cursor:pointer;direction:ltr}
.tags button.on,.tags button:hover{color:var(--accent);border-color:var(--accent)}

/* post view */
.post{max-width:780px;margin:0 auto;padding:34px 0 80px}
.back{display:inline-block;margin-bottom:18px;font-size:14px}
.post h1{font-size:clamp(25px,4.5vw,34px);line-height:1.4;margin:0 0 10px}
.post .head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.prose h2{margin-top:34px;font-size:23px;border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.prose h3{margin-top:26px;font-size:18px}
.prose p,.prose li{max-width:70ch}
.prose pre{direction:ltr;text-align:left;background:#0a101c;color:#cfe3ff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.6;font-size:14px}
.prose code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-size:.9em;background:var(--panel2);padding:1px 6px;border-radius:4px}
.prose pre code{background:none;padding:0}
.prose blockquote{margin:18px 0;padding:10px 16px;background:var(--panel2);border-inline-start:3px solid var(--mid);border-radius:6px;color:var(--text)}
.prose blockquote p{margin:4px 0}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;margin:16px 0}
.prose th,.prose td{border:1px solid var(--line);padding:7px 12px;text-align:start}
.prose th{background:var(--panel2)}
.prose img{max-width:100%;border-radius:8px}
.prose a{text-decoration:underline}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>

<header class="bar"><div class="wrap">
  <a class="brand" href="#" id="home"><i></i>soc@log:~$</a>
  <nav>
    <a class="btn" id="gh" href="https://github.com/USERNAME" target="_blank" rel="noopener">GitHub</a>
    <button class="btn" id="theme" type="button" aria-label="تبديل الثيم">◐</button>
  </nav>
</div></header>

<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* =====================================================
   1) إعدادات المدونة — عدّلها براحتك
   ===================================================== */
const SITE = {
  title: "يوميات محلل SOC",
  tagline: "بذاكر Tier 1 وبسجّل كل حاجة اتعلمتها: Logs، SIEM، Incident Response، وتحليل التهديدات.",
  github: "https://github.com/USERNAME",   // غيّر USERNAME
  author: "محمد"
};

/* =====================================================
   2) المقالات بتتقرا من فولدر posts/ — شوف README
   ===================================================== */
let POSTS = [];
let sorted = [];

/* =====================================================
   3) الكود — مش محتاج تلمسه
   ===================================================== */
const LV = {easy:"سهل", medium:"متوسط", hard:"صعب", done:"متقن"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = {q:"", cat:"", tag:""};


function parseMd(name, txt){
  const m = txt.replace(/\r/g,"").match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  const meta = {}, body = m ? m[2] : txt;
  if(m) m[1].split("\n").forEach(l => { const i = l.indexOf(":"); if(i>0) meta[l.slice(0,i).trim()] = l.slice(i+1).trim(); });
  const id = name.replace(/\.md$/,"");
  const tags = (meta.tags||"").replace(/^\[|\]$/g,"").split(",").map(t=>t.trim()).filter(Boolean);
  return {id, num:(id.match(/^\d+/)||[id])[0], title:meta.title||id, date:meta.date||"", category:meta.category||"General",
          tags, level:LV[meta.level]?meta.level:"easy", summary:meta.summary||"", body};
}
async function loadPosts(){
  try{
    const files = await (await fetch("posts/index.json",{cache:"no-store"})).json();
    POSTS = await Promise.all(files.map(async f => parseMd(f, await (await fetch("posts/"+encodeURIComponent(f))).text())));
    sorted = [...POSTS].sort((a,b) => b.date.localeCompare(a.date));
  }catch(e){
    $("#app").innerHTML = `<div class="empty" style="margin-top:60px">تعذّر تحميل المقالات. لو بتفتح الملف من الجهاز مباشرة، شغّل سيرفر محلي: <code style="direction:ltr">python -m http.server</code> أو ارفعه على GitHub Pages.</div>`;
    throw e;
  }
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return sorted.filter(p =>
    (!state.cat || p.category === state.cat) &&
    (!state.tag || p.tags.includes(state.tag)) &&
    (!q || (p.title + p.summary + p.tags.join(" ") + p.category).toLowerCase().includes(q))
  );
}
function countBy(fn){ const m = {}; POSTS.forEach(p => fn(p).forEach(k => m[k] = (m[k]||0)+1)); return m; }

function renderList(){
  const cats = countBy(p => [p.category]), tags = countBy(p => p.tags);
  const list = filtered();
  $("#app").innerHTML = `
  <section class="hero">
    <h1>${esc(SITE.title)}</h1>
    <p>${esc(SITE.tagline)}</p>
    <div class="stats">
      <span class="stat"><b>${POSTS.length}</b>posts</span>
      <span class="stat"><b>${Object.keys(cats).length}</b>categories</span>
      <span class="stat"><b>${sorted[0] ? sorted[0].date : "-"}</b>last update</span>
    </div>
  </section>
  <div class="grid">
    <section>
      <input class="search" id="q" type="search" placeholder="ابحث في المقالات..." value="${esc(state.q)}" aria-label="بحث">
      <div class="queue">
        <div class="qhead"><span>ID</span><span>الموضوع</span><span>التاريخ</span></div>
        ${list.length ? list.map(p => `
          <a class="row sev ${p.level}" href="#post-${esc(p.id)}">
            <span class="pid">POST-${esc(p.num)}</span>
            <div><div class="ttl">${esc(p.title)}</div>
              <div class="meta"><span class="chip">${esc(p.category)}</span>${p.tags.map(t=>`<span class="chip">#${esc(t)}</span>`).join("")}<span class="chip" style="font-family:var(--sans)">${LV[p.level]||""}</span></div>
            </div>
            <span class="date">${esc(p.date)}</span>
          </a>`).join("") : `<div class="empty">مفيش نتائج. جرّب كلمة تانية أو امسح الفلتر.</div>`}
      </div>
    </section>
    <aside>
      <div class="box cats"><h3>التصنيفات</h3>
        <button class="${state.cat===""?"on":""}" data-cat="">الكل <span>${POSTS.length}</span></button>
        ${Object.entries(cats).map(([c,n]) => `<button class="${state.cat===c?"on":""}" data-cat="${esc(c)}"><bdi>${esc(c)}</bdi><span>${n}</span></button>`).join("")}
      </div>
      <div class="box"><h3>الوسوم</h3><div class="tags">
        ${Object.keys(tags).map(t => `<button class="${state.tag===t?"on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}
      </div></div>
    </aside>
  </div>`;
  const q = $("#q");
  q.addEventListener("input", e => { state.q = e.target.value; const pos = e.target.selectionStart; renderList(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { state.cat = b.dataset.cat; renderList(); });
  document.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => { state.tag = state.tag===b.dataset.tag ? "" : b.dataset.tag; renderList(); });
}

function renderPost(id){
  const p = POSTS.find(x => x.id === id);
  if(!p){ location.hash = ""; return; }
  const html = marked.parse(p.body.trim(), {gfm:true, breaks:false});
  $("#app").innerHTML = `
  <article class="post">
    <a class="back" href="#">← كل المقالات</a>
    <div class="head">
      <div class="meta"><span class="chip">POST-${esc(p.num)}</span><span class="chip">${esc(p.category)}</span><span class="chip">${esc(p.date)}</span>${p.tags.map(t=>`<span class="chip">#${esc(t)}</span>`).join("")}</div>
      <h1>${esc(p.title)}</h1>
    </div>
    <div class="prose">${html}</div>
  </article>`;
  document.title = p.title + " — " + SITE.title;
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash.replace("#","");
  document.title = SITE.title;
  if(h.startsWith("post-")) renderPost(h.slice(5)); else renderList();
}

$("#gh").href = SITE.github;
$("#foot").textContent = "© " + new Date().getFullYear() + " " + SITE.author + " — مبني للتعلم والتوثيق";
$("#home").addEventListener("click", () => { state.q = state.cat = state.tag = ""; });
$("#theme").addEventListener("click", () => {
  const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  r.dataset.theme = cur === "dark" ? "light" : "dark";
});
window.addEventListener("hashchange", route);
loadPosts().then(route).catch(()=>{});
</script>
</body>
</html>
