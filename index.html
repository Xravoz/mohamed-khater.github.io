<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Mohamed Khater - Soc Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0a0b; --surface:#131316; --line:#27272c; --text:#f4f4f5; --muted:#a1a1aa; --accent:#8ab4ff;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff; --surface:#f5f5f6; --line:#e4e4e7; --text:#09090b; --muted:#52525b; --accent:#1d4ed8;
}
:root{
  --sans:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --easy:#6ea8fe; --medium:#f5b942; --hard:#ff6b6b; --done:#4ade80;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.col{max-width:720px;margin:0 auto;padding:0 24px}

header{padding:28px 0}
header .col{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--mono);font-weight:500;font-size:15px;direction:ltr;letter-spacing:.2px}
.brand span{color:var(--accent)}
nav{display:flex;gap:22px;font-size:15px;color:var(--muted)}
nav a,nav button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}
nav a:hover,nav button:hover{color:var(--text)}

.hero{padding:56px 0 36px}
.hero h1{margin:0;font-size:clamp(34px,7vw,52px);line-height:1.2;font-weight:700;letter-spacing:-.5px}
.hero p{margin:18px 0 0;color:var(--muted);font-size:18px;max-width:560px}
.stat{margin-top:22px;font-family:var(--mono);font-size:13px;color:var(--muted);direction:ltr;text-align:right}

.tools{border-top:1px solid var(--line);padding-top:26px}
.search{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;padding:8px 0 12px;border-radius:0}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:20px;font-size:15px}
.filters button{background:none;border:0;padding:2px 0;color:var(--muted);font:inherit;cursor:pointer;border-bottom:1px solid transparent}
.filters button:hover{color:var(--text)}
.filters button.on{color:var(--text);border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-family:var(--mono);font-size:13px;direction:ltr;justify-content:flex-end}
.tags button{background:none;border:0;padding:0;color:var(--muted);font:inherit;cursor:pointer}
.tags button:hover,.tags button.on{color:var(--accent)}

.list{margin-top:34px;border-top:1px solid var(--line)}
.item{display:block;padding:28px 0;border-bottom:1px solid var(--line)}
.item .d{font-family:var(--mono);font-size:13px;color:var(--muted);direction:ltr;text-align:right}
.item h2{margin:6px 0 6px;font-size:23px;line-height:1.45;font-weight:600;transition:color .15s}
.item:hover h2{color:var(--accent)}
.item p{margin:0;color:var(--muted);font-size:16px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.lv{display:inline-flex;align-items:center;gap:7px}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.item[dir=ltr] .d{text-align:left}
.empty{padding:50px 0;color:var(--muted)}
.warn{margin-top:26px;padding:14px 18px;border:1px solid var(--hard);border-radius:10px;font-size:15px;color:var(--text)}
.warn code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}

.post{padding:20px 0 90px}
.back{color:var(--muted);font-size:15px}
.back:hover{color:var(--text)}
.post h1{margin:26px 0 14px;font-size:clamp(28px,5.5vw,40px);line-height:1.35;font-weight:700;letter-spacing:-.3px}
.post .meta{margin:0 0 36px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.prose h2{margin:46px 0 10px;font-size:25px;line-height:1.45;font-weight:600}
.prose h3{margin:32px 0 8px;font-size:19px;font-weight:600}
.prose p,.prose li{color:var(--text)}
.prose li{margin:4px 0}
.prose a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.prose pre{direction:ltr;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;overflow-x:auto;font-size:14.5px;line-height:1.7;margin:22px 0}
.prose code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-size:.88em;background:var(--surface);border:1px solid var(--line);padding:1px 7px;border-radius:5px}
.prose pre code{background:none;border:0;padding:0}
.prose blockquote{margin:24px 0;padding:2px 20px;border-inline-start:2px solid var(--accent);color:var(--muted)}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;margin:24px 0;font-size:16px}
.prose th,.prose td{padding:10px 16px;text-align:start;border-bottom:1px solid var(--line)}
.prose th{color:var(--muted);font-weight:500;border-bottom-color:var(--text)}
.prose img{max-width:100%;border-radius:10px}
.prose hr{border:0;border-top:1px solid var(--line);margin:40px 0}

footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header><div class="col">
  <a class="brand" href="#" id="home"><span>&gt;_</span> SOC Log</a>
  <nav>
    <a id="gh" href="https://github.com/USERNAME" target="_blank" rel="noopener">GitHub</a>
    <button id="theme" type="button" aria-label="تبديل الثيم">فاتح / داكن</button>
  </nav>
</div></header>

<main class="col" id="app"></main>
<footer><div class="col" id="foot"></div></footer>

<script>
/* ===== إعدادات المدونة — عدّلها براحتك ===== */
const SITE = {
  title: "يوميات محلل SOC",
  tagline: "ملاحظات ومختبرات من رحلتي في تحليل الأمن: Logs وSIEM والاستجابة للحوادث.",
  github: "https://github.com/Xravoz",   // غيّر USERNAME
  author: "Mohamed Khater"
};

/* ===== الكود — مش محتاج تلمسه ===== */
const LV = {easy:"سهل", medium:"متوسط", hard:"صعب", done:"متقن"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = {q:"", cat:"", tag:""};
let POSTS = [], sorted = [], MISSING = [];

function parseMd(name, txt){
  const m = txt.replace(/\r/g,"").match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  const meta = {}, body = m ? m[2] : txt;
  if(m) m[1].split("\n").forEach(l => { const i = l.indexOf(":"); if(i>0) meta[l.slice(0,i).trim()] = l.slice(i+1).trim(); });
  const id = name.replace(/\.md$/,"");
  const tags = (meta.tags||"").replace(/^\[|\]$/g,"").split(",").map(t=>t.trim()).filter(Boolean);
  const h1 = (body.match(/^#\s+(.+)$/m)||[])[1];
  return {id, title:meta.title||h1||id, date:meta.date||"", category:meta.category||"General",
          tags, dir:meta.dir==="ltr"?"ltr":"rtl", level:LV[meta.level]?meta.level:"easy", summary:meta.summary||"", body};
}
async function loadPosts(){
  try{
    const files = await (await fetch("posts/index.json?v="+Date.now(),{cache:"no-store"})).json();
    const miss = [];
    const got = await Promise.all(files.map(async f => {
      const r = await fetch("posts/"+encodeURIComponent(f)+"?v="+Date.now(), {cache:"no-store"});
      const t = r.ok ? await r.text() : "";
      if(!r.ok || /^\s*<!doctype html/i.test(t)){ miss.push(f+" ["+r.status+"]"); return null; }
      return parseMd(f, t);
    }));
    POSTS = got.filter(Boolean); MISSING = miss;
    sorted = [...POSTS].sort((a,b) => b.date.localeCompare(a.date));
  }catch(e){
    $("#app").innerHTML = `<div class="empty">تعذّر تحميل المقالات. لو بتفتح الملف من الجهاز مباشرة، شغّل <code>python -m http.server</code> أو ارفعه على GitHub Pages.</div>`;
    throw e;
  }
}
function filtered(){
  const q = state.q.trim().toLowerCase();
  return sorted.filter(p =>
    (!state.cat || p.category === state.cat) &&
    (!state.tag || p.tags.includes(state.tag)) &&
    (!q || (p.title + p.summary + p.tags.join(" ") + p.category).toLowerCase().includes(q)));
}
const uniq = a => [...new Set(a)];
const lvHtml = l => `<span class="lv" style="--c:var(--${l})"><i></i>${LV[l]}</span>`;

function renderList(){
  const cats = uniq(POSTS.map(p => p.category)), tags = uniq(POSTS.flatMap(p => p.tags));
  const list = filtered();
  $("#app").innerHTML = `
  <section class="hero">
    <h1>${esc(SITE.title)}</h1>
    <p>${esc(SITE.tagline)}</p>
    <div class="stat">${POSTS.length} posts / updated ${sorted[0] ? esc(sorted[0].date) : "-"}</div>
  </section>
  <section class="tools">
    <input class="search" id="q" type="search" placeholder="ابحث في المقالات" value="${esc(state.q)}" aria-label="بحث">
    <div class="filters">
      <button class="${state.cat===""?"on":""}" data-cat="">الكل</button>
      ${cats.map(c => `<button class="${state.cat===c?"on":""}" data-cat="${esc(c)}"><bdi>${esc(c)}</bdi></button>`).join("")}
    </div>
    <div class="tags">${tags.map(t => `<button class="${state.tag===t?"on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>
  </section>
  ${MISSING.length ? `<div class="warn">الملفات دي مكتوبة في <code>posts/index.json</code> بس مش موجودة في فولدر <code>posts</code>: ${MISSING.map(f=>`<code>${esc(f)}</code>`).join(" ")}</div>` : ""}
  <section class="list">
    ${list.length ? list.map(p => `
      <a class="item" dir="${p.dir}" href="#post-${esc(p.id)}">
        <div class="d">${esc(p.date)}</div>
        <h2>${esc(p.title)}</h2>
        ${p.summary ? `<p>${esc(p.summary)}</p>` : ""}
        <div class="meta"><bdi>${esc(p.category)}</bdi>${lvHtml(p.level)}</div>
      </a>`).join("") : `<div class="empty">مفيش نتائج. جرّب كلمة تانية أو امسح الفلتر.</div>`}
  </section>`;
  $("#q").addEventListener("input", e => { state.q = e.target.value; const pos = e.target.selectionStart; renderList(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { state.cat = b.dataset.cat; renderList(); });
  document.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => { state.tag = state.tag===b.dataset.tag ? "" : b.dataset.tag; renderList(); });
}

function renderPost(id){
  const p = POSTS.find(x => x.id === id);
  if(!p){ location.hash = ""; return; }
  $("#app").innerHTML = `
  <article class="post" dir="${p.dir}">
    <a class="back" href="#">${p.dir==="ltr" ? "← All posts" : "→ كل المقالات"}</a>
    <h1>${esc(p.title)}</h1>
    <div class="meta"><span style="font-family:var(--mono);direction:ltr">${esc(p.date)}</span><bdi>${esc(p.category)}</bdi>${lvHtml(p.level)}</div>
    <div class="prose">${marked.parse(p.body.trim(), {gfm:true})}</div>
  </article>`;
  document.title = p.title + " — " + SITE.title;
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash.replace("#","");
  document.title = SITE.title;
  if(h.startsWith("post-")) renderPost(decodeURIComponent(h.slice(5))); else renderList();
}

function setTheme(t){ document.documentElement.dataset.theme = t; try{ localStorage.setItem("theme", t); }catch(e){} }
try{ const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("#gh").href = SITE.github;
$("#foot").textContent = "© " + new Date().getFullYear() + " " + SITE.author;
$("#home").addEventListener("click", () => { state.q = state.cat = state.tag = ""; });
window.addEventListener("hashchange", route);
loadPosts().then(route).catch(()=>{});
</script>
</body>
</html>
